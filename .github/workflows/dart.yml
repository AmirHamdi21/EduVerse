name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Code Quality & Static Analysis
  # ─────────────────────────────────────────
  code_quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (strict)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # PANA is disabled — only useful for pub.dev packages, not apps.
      # Re-enable if you ever publish this project as a package.
      # - name: Pub score (PANA)
      #   uses: flutterings/dart-package-analyzer@v1
      #   with:
      #     flutter_version: 3.35.5
      #     flutter_channel: stable

  # ─────────────────────────────────────────
  # JOB 2: Unit & Widget Tests + Coverage
  # ─────────────────────────────────────────
  tests_and_coverage:
    name: 🧪 Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  # ─────────────────────────────────────────
  # JOB 3: Integration Tests on Android
  # ─────────────────────────────────────────
  integration_tests:
    name: 📱 Integration Tests (Android Emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM (faster emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: Nexus 6
          script: flutter test integration_test

  # ─────────────────────────────────────────
  # JOB 4: Build Check (APK)
  # Runs only after quality + tests pass
  # ─────────────────────────────────────────
  build_check:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest
    needs: [ code_quality, tests_and_coverage ]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
