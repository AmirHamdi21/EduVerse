  # ─────────────────────────────────────────
  # JOB 4: Build Check (APK)
  # Runs only after quality + tests pass
  # ─────────────────────────────────────────
  build_check:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest
    needs: [ code_quality, tests_and_coverage ]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Auto-create a GitHub Issue if this job fails
      - name: 🐛 Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🏗️ APK Build Failed on ${context.sha.slice(0,7)}`,
              body: [
                `## ❌ Release APK Build Failed`,
                `**Branch:** \`${context.ref}\``,
                `**Commit:** \`${context.sha.slice(0,7)}\``,
                `**Run:** [View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                ``,
                `### What to check`,
                `- Run \`flutter build apk --release\` locally`,
                `- Check for missing signing configs or gradle issues`,
              ].join('\n'),
              labels: ['bug', 'ci-failure', 'build']
            })

  # ─────────────────────────────────────────
  # JOB 5: CodeQL Security Scanning
  # Auto-creates issues in the Security tab
  # ─────────────────────────────────────────
  codeql:
    name: 🔐 CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java  # Covers the Android/Java layer of your Flutter app

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
