name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Code Quality & Static Analysis
  # ─────────────────────────────────────────
  code_quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (strict)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # PANA is disabled — only useful for pub.dev packages, not apps.
      # Re-enable if you ever publish this project as a package.
      # - name: Pub score (PANA)
      #   uses: flutterings/dart-package-analyzer@v1
      #   with:
      #     flutter_version: 3.35.5
      #     flutter_channel: stable

      # Auto-create a GitHub Issue if this job fails
      - name: 🐛 Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔍 Code Quality Failed on ${context.sha.slice(0,7)}`,
              body: [
                `## ❌ Code Quality Check Failed`,
                `**Branch:** \`${context.ref}\``,
                `**Commit:** \`${context.sha.slice(0,7)}\``,
                `**Run:** [View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                ``,
                `### What to check`,
                `- Run \`flutter analyze\` locally`,
                `- Run \`dart format . \` to fix formatting`,
              ].join('\n'),
              labels: ['bug', 'ci-failure', 'code-quality']
            })

  # ─────────────────────────────────────────
  # JOB 2: Unit & Widget Tests + Coverage
  # ─────────────────────────────────────────
  tests_and_coverage:
    name: 🧪 Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      # Auto-create a GitHub Issue if this job fails
      - name: 🐛 Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🧪 Tests Failed on ${context.sha.slice(0,7)}`,
              body: [
                `## ❌ Test Suite Failed`,
                `**Branch:** \`${context.ref}\``,
                `**Commit:** \`${context.sha.slice(0,7)}\``,
                `**Run:** [View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                ``,
                `### What to check`,
                `- Run \`flutter test\` locally to reproduce`,
                `- Check which test file failed in the logs above`,
              ].join('\n'),
              labels: ['bug', 'ci-failure', 'tests']
            })

